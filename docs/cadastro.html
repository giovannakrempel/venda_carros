<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - AutoAnúncios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">AutoAnúncios</a>
        </div>
    </nav>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h3 class="card-title mb-3">Cadastro de Usuário</h3>
                            <form id="cadastroForm" class="needs-validation" novalidate>
                                <div class="mb-3">
                                    <label for="nome" class="form-label">Nome</label>
                                    <input id="nome" name="nome" type="text" class="form-control" required>
                                    <div class="invalid-feedback">Informe seu nome.</div>
                                </div>
                                <div class="mb-3">
                                    <label for="cpf" class="form-label">CPF</label>
                                    <input id="cpf" name="cpf" type="text" class="form-control" pattern="\d{11}" placeholder="Apenas números" required>
                                    <div class="invalid-feedback">Informe um CPF válido (11 dígitos).</div>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">E-mail</label>
                                    <input id="email" name="email" type="email" class="form-control" required>
                                    <div class="invalid-feedback">Informe um e-mail válido.</div>
                                </div>
                                <div class="mb-3">
                                    <label for="senha" class="form-label">Senha</label>
                                    <input id="senha" name="senha" type="password" class="form-control" required minlength="6">
                                    <div class="invalid-feedback">Senha com no mínimo 6 caracteres.</div>
                                </div>
                                <div class="mb-3">
                                    <label for="telefone" class="form-label">Telefone</label>
                                    <input id="telefone" name="telefone" type="tel" class="form-control" required>
                                    <div class="invalid-feedback">Informe um telefone.</div>
                                </div>
                                <div class="d-grid">
                                    <button class="btn btn-primary" type="submit">Cadastrar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center small py-3">&copy; 2026 AutoAnúncios</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function(){
            var form = document.getElementById('cadastroForm');
            form.addEventListener('submit', function(e){
                e.preventDefault();
                if (!form.checkValidity()) { form.classList.add('was-validated'); return; }
                alert('Cadastro simulado realizado com sucesso.');
                form.reset();
                form.classList.remove('was-validated');
            });
        })();
    </script>
</body>
</html>
